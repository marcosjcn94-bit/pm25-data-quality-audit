name: Reproduce audit
on: [push, pull_request]
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run --locked pytest -q
      - run: uv run --locked python audit.py --input data/daily.csv --output results
      - run: sha256sum -c checksums.sha256
      - run: uv run --locked python figure.py
      - run: uv run --locked jupyter nbconvert --to notebook --execute study.ipynb --output /tmp/study-executed.ipynb
